name: Deploy Hugo Site to Pages

# 触发机制：当你 push 代码到 main 分支时自动启动工作流
on:
  push:
    branches: ["main"]
  workflow_dispatch: # 允许在 GitHub 网页上手动点击按钮构建

# 赋予工作流部署 GitHub Pages 所需的操作权限
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码并拉取主题
        uses: actions/checkout@v4
        with:
          submodules: recursive # 必须设置，用于递归下载 PaperMod 主题文件
          fetch-depth: 0

      - name: 初始化 Pages 部署环境
        id: pages
        uses: actions/configure-pages@v5

      - name: 在云端安装 Hugo Extended
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true      # 采用扩展版，用于编译主题的 SCSS 样式

      - name: 编译 Markdown 为 HTML 静态网页
        # 将 Markdown 原料套入模具压制成网页，存放于 public/ 目录
        run: hugo --minify --baseURL "${{ steps.pages.outputs.base_url }}/"

      - name: 上传构建产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 将静态文件分发到 GitHub Pages 节点
        id: deployment
        uses: actions/deploy-pages@v4